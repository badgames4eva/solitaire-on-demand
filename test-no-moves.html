<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test No Moves Left Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #2d5a27;
            color: white;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #4CAF50;
            border-radius: 8px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
        .test-result {
            background: #333;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
        }
        .success {
            border-left: 4px solid #4CAF50;
        }
        .error {
            border-left: 4px solid #f44336;
        }
    </style>
</head>
<body>
    <h1>Solitaire "No Moves Left" Detection Test</h1>
    
    <div class="test-section">
        <h2>Test Controls</h2>
        <p>This page tests the "no moves left" detection system by creating scenarios and checking if the system properly detects them.</p>
        
        <button onclick="loadMainGame()">Load Main Game</button>
        <button onclick="testNoMovesDetection()">Test No Moves Detection</button>
        <button onclick="testGiveUpButton()">Test Give Up Button</button>
    </div>

    <div class="test-section">
        <h2>Test Results</h2>
        <div id="test-results"></div>
    </div>

    <div class="test-section">
        <h2>Game Container</h2>
        <iframe id="game-frame" src="index.html" width="100%" height="600px" style="border: 1px solid #4CAF50;"></iframe>
    </div>

    <script>
        function log(message, type = 'info') {
            const results = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong> - ${message}`;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }

        function loadMainGame() {
            log('Loading main game...', 'info');
            const iframe = document.getElementById('game-frame');
            iframe.src = 'index.html';
            
            // Wait for game to load then start a hard game
            setTimeout(() => {
                try {
                    const gameWindow = iframe.contentWindow;
                    if (gameWindow.solitaireGame) {
                        log('Game loaded successfully', 'success');
                        
                        // Start a hard game automatically
                        setTimeout(() => {
                            gameWindow.solitaireGame.uiManager.startNewGame('hard');
                            log('Started Hard game for testing', 'success');
                        }, 1000);
                    } else {
                        log('Game not ready yet, retrying...', 'error');
                        setTimeout(loadMainGame, 1000);
                    }
                } catch (error) {
                    log(`Error accessing game: ${error.message}`, 'error');
                }
            }, 2000);
        }

        function testNoMovesDetection() {
            log('Testing no moves left detection...', 'info');
            
            try {
                const iframe = document.getElementById('game-frame');
                const gameWindow = iframe.contentWindow;
                
                if (!gameWindow.solitaireGame) {
                    log('Game not loaded. Please load main game first.', 'error');
                    return;
                }

                const game = gameWindow.solitaireGame;
                
                // Check if the test function exists
                if (gameWindow.debugSolitaire && gameWindow.debugSolitaire.testNoMovesScenario) {
                    log('Found debug test function. Creating no-moves scenario...', 'info');
                    
                    // Create a no-moves scenario
                    const result = gameWindow.debugSolitaire.testNoMovesScenario();
                    log(`Test scenario result: ${result}`, 'success');
                    
                    // Wait a moment then check if game over modal appeared
                    setTimeout(() => {
                        const modal = gameWindow.document.getElementById('game-over-modal');
                        if (modal && modal.classList.contains('active')) {
                            const title = gameWindow.document.getElementById('game-over-title');
                            const message = gameWindow.document.getElementById('game-over-message');
                            log(`✅ SUCCESS: Game Over modal appeared!`, 'success');
                            log(`Title: "${title?.textContent || 'N/A'}"`, 'success');
                            log(`Message: "${message?.textContent || 'N/A'}"`, 'success');
                        } else {
                            log('❌ ISSUE: No game over modal detected', 'error');
                            
                            // Check if game state indicates it's lost
                            if (game.gameState.gameLost) {
                                log('Game state shows game is lost', 'info');
                            } else {
                                log('Game state does not show game is lost', 'error');
                            }
                        }
                    }, 1000);
                    
                } else {
                    log('Debug functions not available. Trying manual approach...', 'info');
                    
                    // Manually trigger the no moves check
                    if (game.uiManager && typeof game.uiManager.checkNoMovesLeft === 'function') {
                        game.uiManager.checkNoMovesLeft();
                        log('Manually triggered checkNoMovesLeft()', 'info');
                    } else {
                        log('checkNoMovesLeft function not found', 'error');
                    }
                }
                
            } catch (error) {
                log(`Error during test: ${error.message}`, 'error');
                console.error('Full error:', error);
            }
        }

        function testGiveUpButton() {
            log('Testing Give Up button functionality...', 'info');
            
            try {
                const iframe = document.getElementById('game-frame');
                const gameWindow = iframe.contentWindow;
                
                if (!gameWindow.solitaireGame) {
                    log('Game not loaded. Please load main game first.', 'error');
                    return;
                }

                // Find and click the Give Up button
                const giveUpBtn = gameWindow.document.querySelector('[data-action="give-up"]');
                if (giveUpBtn) {
                    log('Found Give Up button, clicking it...', 'info');
                    
                    // Mock the confirm dialog to automatically accept
                    const originalConfirm = gameWindow.confirm;
                    gameWindow.confirm = function(message) {
                        log(`Confirm dialog appeared: "${message}"`, 'info');
                        return true; // Automatically accept
                    };
                    
                    giveUpBtn.click();
                    
                    // Check if game over modal appeared
                    setTimeout(() => {
                        const modal = gameWindow.document.getElementById('game-over-modal');
                        if (modal && modal.classList.contains('active')) {
                            const title = gameWindow.document.getElementById('game-over-title');
                            const message = gameWindow.document.getElementById('game-over-message');
                            log(`✅ SUCCESS: Give Up worked! Game Over modal appeared!`, 'success');
                            log(`Title: "${title?.textContent || 'N/A'}"`, 'success');
                            log(`Message: "${message?.textContent || 'N/A'}"`, 'success');
                        } else {
                            log('❌ ISSUE: Give Up did not trigger game over modal', 'error');
                        }
                        
                        // Restore original confirm
                        gameWindow.confirm = originalConfirm;
                    }, 500);
                    
                } else {
                    log('❌ Give Up button not found. Make sure you are in game screen.', 'error');
                }
                
            } catch (error) {
                log(`Error during Give Up test: ${error.message}`, 'error');
            }
        }

        // Auto-load game when page loads
        window.addEventListener('load', () => {
            log('Test page loaded. Click "Load Main Game" to begin testing.', 'info');
        });
    </script>
</body>
</html>
